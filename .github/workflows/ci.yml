name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plugin's own code: the MCP server, the PostToolUse hook and the shared rules.
  plugin:
    name: Plugin engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check src/server.js
          for f in src/lib/*.js src/lib/languages/*.js; do node --check "$f"; done
          node --check src/hooks/dependency-check.js
          node --check src/hooks/session-start.js
          node --check scripts/verify-example.mjs
          node --check scripts/check-snippets.mjs

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
            echo "ok $f"
          done

      # The MCP server is declared inline in plugin.json (not in a root .mcp.json, which Claude Code would
      # also load as this repository's project config, where CLAUDE_PLUGIN_ROOT does not exist).
      - name: MCP server paths in plugin.json exist
        run: |
          node -e '
            const fs = require("fs");
            const { mcpServers = {} } = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            if (!Object.keys(mcpServers).length) throw new Error("plugin.json declares no mcpServers");
            for (const [name, s] of Object.entries(mcpServers))
              for (const a of s.args || [])
                if (a.includes("${CLAUDE_PLUGIN_ROOT}")) {
                  const p = a.replace("${CLAUDE_PLUGIN_ROOT}", ".");
                  if (!fs.existsSync(p)) throw new Error(`${name}: ${p} does not exist`);
                  console.log(`ok ${name} -> ${p}`);
                }
          '

      # A scanner that reports nothing may simply be broken, so this checks BOTH directions: the example
      # must be clean, and planted violations must be found (plus legacy layout, scaffold and the hook).
      - name: Verify the engine against the reference example
        run: npm run verify:example

  # The reference project: it must keep building, linting (architecture rules) and passing its tests.
  example:
    name: Example (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the first release with `node:sqlite` unflagged (the example's `engines` floor)
        node: ['22.13.0', '22', '24']
    defaults:
      run:
        working-directory: examples/shop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/shop/package-lock.json

      - name: Install (from the lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (the Dependency Rule and the Module Rule as ESLint errors)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck the TypeScript fixture (with this toolchain)
        run: npx tsc -p ../../fixtures/typescript/tsconfig.json --typeRoots ./node_modules/@types --types node

  # Every language fixture must be real code: it builds and runs with its own toolchain.
  fixtures:
    name: Fixtures and skill references (Go, Python, SQL, TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go fixture builds, vets and passes its tests
        working-directory: fixtures/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go run ./cmd/api

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python fixture runs
        working-directory: fixtures/python
        run: PYTHONPATH=src python -m shop.main

      - name: SQL fixture applies and compiles on SQLite
        run: python fixtures/sql/check.py

      # The skills' code lives in references/<language>.md; every block must parse with its own parser.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TypeScript for the snippet check (from the example's lockfile)
        run: npm ci --prefix examples/shop

      - name: Every code block in the skill references parses (TypeScript, Python, Go)
        run: node scripts/check-snippets.mjs --strict
